<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meld Studio Remote</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/buttons.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/tabs.css">
  <link rel="stylesheet" href="/css/scenes.css">
  <link rel="stylesheet" href="/css/layers.css">
  <link rel="stylesheet" href="/css/transform.css">
  <link rel="stylesheet" href="/css/audio.css">
  <link rel="stylesheet" href="/css/commands.css">
  <link rel="stylesheet" href="/css/media.css">
  <link rel="stylesheet" href="/css/switcher.css">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <header>
    <h1>Meld Studio</h1>
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
      <span class="badge" id="versionBadge"></span>
    </div>
    <div class="transport-controls">
      <button class="btn btn-stream" id="btnStream" data-action="stream">Stream</button>
      <button class="btn btn-record" id="btnRecord" data-action="record">Record</button>
      <button class="btn btn-screenshot" id="btnScreenshot" title="Screenshot">📷</button>
    </div>
  </header>
  <div id="sceneBus" class="scene-bus hidden">
    <div class="bus-live">
      <span class="bus-label live">LIVE</span>
      <span class="bus-name" id="busLiveName">—</span>
      <span class="bus-timer" id="busLiveTimer"></span>
    </div>
    <button class="btn btn-next" id="btnShowNext">SHOW NEXT</button>
    <div class="bus-next">
      <span class="bus-label next">NEXT</span>
      <span class="bus-name" id="busNextName">—</span>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="scenes">Scenes</button>
    <button class="tab" data-tab="layers">Layers</button>
    <button class="tab" data-tab="audio">Audio</button>
    <button class="tab" data-tab="commands">Commands</button>
  </nav>

  <main>
    <section id="tab-scenes" class="tab-content active">
      <div id="sceneModeToggle" class="scene-mode-toggle">
        <button class="btn btn-sm" data-scene-mode="simple">Simple</button>
        <button class="btn btn-sm" data-scene-mode="switcher">Switcher</button>
      </div>
      <div id="sceneList" class="scene-grid"></div>
      <div id="sceneSwitcher" class="scene-switcher hidden"></div>
    </section>

    <section id="tab-layers" class="tab-content">
      <div id="layerHeader" class="layer-header hidden">
        <button id="btnBackScenes" class="btn btn-back">&larr; Back</button>
        <h2 id="layerSceneName"></h2>
      </div>
      <div id="scenePicker" class="scene-picker"></div>
      <div id="layerList" class="card-list"></div>
    </section>

    <section id="tab-audio" class="tab-content">
      <div id="trackList" class="card-list"></div>
    </section>

    <section id="tab-commands" class="tab-content">
      <div id="commandDeck" class="command-deck"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <div id="disconnectOverlay" class="disconnect-overlay hidden">
    <div class="disconnect-card">
      <span class="disconnect-spinner"></span>
      <h2>Disconnected</h2>
      <p>Lost connection to the bridge — reconnecting&hellip;</p>
    </div>
  </div>

  <!-- Load order matters: these scripts share globals (no bundler/modules). -->
  <!-- Helpers + state first, then renderers, then actions, then the entry point. -->
  <script src="/js/dom.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/catalog.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/render-scenes.js"></script>
  <script src="/js/render-media.js"></script>
  <script src="/js/render-layers.js"></script>
  <script src="/js/transform.js"></script>
  <script src="/js/render-audio.js"></script>
  <script src="/js/render-commands.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/actions.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
